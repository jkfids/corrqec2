[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "corrqec2"
description = "Spatiotemporal Pauli processes: correlated noise models and surface code simulations."
readme = "README.md"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "John F. Kam", email = "jfidelkam@gmail.com" }]
keywords = [
  "quantum error correction",
  "surface code",
  "correlated noise",
  "process tensor",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
]

# Everything needed to run the experiments and regenerate the paper figures.
# processtensor is not on PyPI; it is installed from its source repository.
dependencies = [
  "matplotlib",
  "numba",
  "numpy",
  "processtensor @ git+https://github.com/jkfids/process-tensor@6ef3e87049e845a31471f9b42dd9d9c057504ec8",
  "PyMatching",
  "scipy",
  "seaborn",
  "sinter",
  "stim",
]

[tool.setuptools.dynamic]
version = { attr = "corrqec2.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
